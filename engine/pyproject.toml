[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-engine"
version = "0.1.1"
description = "Clipwright media analysis and render engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "faster-whisper>=1.0",
  "yt-dlp>=2025.1.1",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "llama-cpp-python>=0.3.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
shorts-engine = "shorts_engine.cli:main"

[tool.setuptools.packages.find]
include = ["shorts_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls a real external AI endpoint (requires GROQ_API_KEY)",
  "slow: downloads models or renders video",
]
